<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RaktSetu</title>
    <link rel="stylesheet" href="Login.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;700;800&display=swap" rel="stylesheet">
    <script type="module" src="analytics.js"></script>
</head>
<body>
    <div class="page-container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <a href="./index.html">
                        <img src="assets/RaktSetu Logo red.png" alt="Logo">
                    </a>
                </div>
                <nav class="main-nav">
                    <ul>
                        <li><a href="./contact.html">Contact</a></li>
                        <li><a href="./About.html">About</a></li>
                        <li><a href="#" class="support-us-btn">Support Us</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="login-main">
            <div class="login-card">
                <div class="login-header">
                    <h1>Donor Login</h1>
                    <p>Please enter your mobile number to proceed. We'll send an OTP for verification.</p>
                </div>
                <form class="login-form">
                    <div class="form-group">
                        <label for="mobile-number">Mobile Number</label>
                        <input type="tel" id="mobile-number" placeholder="+91 XXXXX XXXXX" required>
                    </div>
                    <button type="submit" class="submit-btn">Send OTP</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
